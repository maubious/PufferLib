[base]
env_name = connect4

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 2

[env]
num_agents = 1
player_pieces = 0
env_pieces = 0

[policy]
hidden_size = 512
num_layers = 3
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 22778686
learning_rate = 0.00117995148
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.868995786
gae_lambda = 0.233002305
replay_ratio = 2.91624451
clip_coef = 0.317530006
vf_coef = 2.28229284
vf_clip_coef = 3.47983766
max_grad_norm = 1.36356163
ent_coef = 9.99999975e-06
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.997990072
beta1 = 0.95
beta2 = 0.997055769
eps = 1e-12
minibatch_size = 4096
horizon = 32
vtrace_rho_clip = 1.58602619
vtrace_c_clip = 1.55611944
prio_alpha = 0.273437977
prio_beta0 = 0.00781321526

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e7
max = 2e8
mean = 3e7
scale = 0.5

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 3
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 16384
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 8
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 65536
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.2
max = 0.995
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 4.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
# Lower clip is sometimes better but less stable
min = 0.01
max = 1.0
scale = auto

# Optimal vf clip can be lower than 0.1,
# but this results in jank unstable runs
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.beta2]
distribution = logit_normal
min = 0.9
max = 0.99999
scale = auto

