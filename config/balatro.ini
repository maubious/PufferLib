[base]
env_name = balatro
eval_episodes = 10000
render = 0
load_model_path = 'None'
checkpoint_interval = 0
cudagraphs=-1

[vec]
total_agents = 2048
num_buffers = 1
num_threads = 8

[env]
dr = 0
num_agents = 1
num_bots = 0
seed = 42
deck = all
stake = 1
fast_rng = 1
progress_reward = 0.182285219
contact_reward = 0.0554929264
blind_bonus = 0.300000012
ante_bonus = 0.219656423
ante_escalation = 1.32249653
efficiency_hand = 0.00918198097
efficiency_discard = 0.00159809226
wealth_weight = 0.135011435
win_ante = 16
max_episode_steps = 1024
reorder_actions = 1

[policy]
hidden_size = 64
num_layers = 4
expansion_factor = 1
custom_encoder = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
total_timesteps = 266808624
learning_rate = 0.00453495327
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.999842227
