momentum = 0.882052422
beta1 = 0.95
beta2 = 0.917290926
eps = 1e-12
minibatch_size = 4096
horizon = 128
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
num_start_states = 0
cl_frac = 0.25
fresh_frac = 0.25
anneal_cl = 0
state_trajectory_max_len = 256
state_checkpoint_interval = 16
curriculum_min_admit = 0.0
curriculum_cl_tail_bias = 0

[sweep]
metric = perf
max_runs = 1200
metric_distribution = linear
select_k = 64

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e7
max = 5e8
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 512
scale = auto

[sweep.policy.num_layers]
