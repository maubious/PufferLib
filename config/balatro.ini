[base]
env_name = balatro
eval_episodes = 10000
eval_agents = 1024
render = 0
load_model_path = 'None'
checkpoint_interval = 0

[vec]
total_agents = 2048
num_buffers = 1
num_threads = 8
action_mask_size = 1049

[env]
dr = 0
num_agents = 1
num_bots = 0
seed = 42
deck = 0
stake = 1
potential_scale = 254
progress_reward = 0.677796841
blind_bonus = 0.168150365
ante_bonus = 2.15358877
win_bonus = 1.58533108
loss_penalty = 0.0294510778
win_ante = 8
max_episode_steps = 512
reorder_actions = 1
money_reward = 0

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1
custom_encoder = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 323924912
learning_rate = 0.00255050813
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.999296069
gae_lambda = 0.545808792
vtrace = 0
replay_ratio = 2
clip_coef = 0.201973513
vf_coef = 0.100000001
vf_clip_coef = 0.391808271
max_grad_norm = 0.100000001
ent_coef = 0.000201927221
anneal_ent_coef = 0
