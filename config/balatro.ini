[base]
env_name = balatro

[vec]
total_agents = 2048
num_buffers = 2
num_threads = 8
action_mask_size = 981

[env]
shaped_reward = 1
win_ante = 8
max_episode_steps = 512
fast_rng = 1

[policy]
hidden_size = 64
num_layers = 2
expansion_factor = 1
custom_encoder = 1

[train]
gpus = 1
seed = 42
total_timesteps = 215903184
learning_rate = 0.00512398779
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.985321522
gae_lambda = 0.354559839
vtrace = 0
replay_ratio = 3.52115822
clip_coef = 0.558780432
vf_coef = 2.20739555
vf_clip_coef = 0.00999999978
max_grad_norm = 0.100000001
ent_coef = 0.0357778408
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.950230658
beta1 = 0.95
beta2 = 0.955273807
eps = 1e-12
minibatch_size = 8192
horizon = 32
vtrace_rho_clip = 3.35547876
vtrace_c_clip = 2.01441622

[sweep]
metric = score
# Progressive multi-fidelity sweep over the training budget.
max_runs = 1200

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 1e9
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 3
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 16384
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 8
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 65536
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.2
max = 0.995
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 4.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
# Lower clip is sometimes better but less stable
min = 0.01
max = 1.0
scale = auto

# Optimal vf clip can be lower than 0.1,
# but this results in jank unstable runs
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.beta2]
distribution = logit_normal
min = 0.9
max = 0.99999
scale = auto
