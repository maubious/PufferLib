[base]
env_name = balatro
eval_episodes = 100
eval_agents = 1
render = 0
load_model_path = 'None'

[vec]
total_agents = 2048
num_buffers = 1
num_threads = 8
action_mask_size = 541

[env]
num_agents = 1
deck = 0
stake = 1
potential_scale = 255
progress_reward = 0.285978049
blind_bonus = 0.323201209
ante_bonus = 1.0
win_bonus = 10.6711178
loss_penalty = 0.049926579
win_ante = 8
max_episode_steps = 512
reorder_actions = 0

[policy]
hidden_size = 256
num_layers = 3
expansion_factor = 1
custom_encoder = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 197239710
learning_rate = 0.00409376388
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.999495327
gae_lambda = 0.365750313
vtrace = 0
replay_ratio = 1.80890286
clip_coef = 0.183743209
vf_coef = 0.193465352
vf_clip_coef = 0.57666415
max_grad_norm = 1.12207031
ent_coef = 1.38934884e-05
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.878350973
beta1 = 0.95
beta2 = 0.999385297
eps = 1e-12
minibatch_size = 4096
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
num_start_states = 0
cl_frac = 0.25
fresh_frac = 0.25
anneal_cl = 0
state_trajectory_max_len = 256
state_checkpoint_interval = 16
curriculum_min_admit = 0.0
curriculum_cl_tail_bias = 0

[sweep]
metric = wins
max_runs = 1200

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e7
max = 5e8
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 3
scale = auto

[sweep.vec.total_agents]
