[base]
env_name = balatro
eval_episodes = 10000
eval_agents = 1024
render = 0
load_model_path = 'None'
checkpoint_interval = 0
cudagraphs=-1

[vec]
total_agents = 8192
num_buffers = 1
num_threads = 8

[env]
dr = 0
num_agents = 1
num_bots = 0
seed = 42
deck = all
stake = 1
fast_rng = 1
potential_scale = 244
progress_reward = 0.2
blind_bonus = 0.231837213
ante_bonus = 0.8
ante_escalation = 1.2
win_ante = 16
max_episode_steps = 1024
reorder_actions = 1

[policy]
hidden_size = 128
num_layers = 3
expansion_factor = 1
custom_encoder = 1

[torch]
network = MinGRU
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
total_timesteps = 50099312
learning_rate = 0.0056668683
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.9992311
gae_lambda = 0.686469674
replay_ratio = 2.0
clip_coef = 0.382330805
vf_coef = 0.857504249
vf_clip_coef = 1.78679359
max_grad_norm = 5
ent_coef = 1.65460642e-05
anneal_ent_coef = 0
min_ent_coef_ratio = 0.1
momentum = 0.912137449
minibatch_size = 16384
horizon = 64
vtrace = 0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
verb_eps = 0.0
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0
seed = 42
eps = 1e-12
num_start_states = 0
cl_frac = 0.15
fresh_frac = 0.15
anneal_cl = 0
state_trajectory_max_len = 256
state_checkpoint_interval = 16
curriculum_min_admit = 0.0
curriculum_cl_tail_bias = 0

[sweep]
metric = ante
max_runs = 1200
metric_distribution = linear
select_k = 32

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e7
max = 5e8
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 512
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 4
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 256
max = 16384
scale = auto

[sweep.vec.num_buffers]
distribution = uniform_pow2
min = 1
max = 8
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 65536
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.2
max = 0.995
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 4.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.01
max = 1.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.momentum]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.env.progress_reward]
distribution = uniform
min = 0.02
max = 0.2
scale = auto

[sweep.env.blind_bonus]
distribution = uniform
min = 0.15
max = 0.30
scale = auto

[sweep.env.ante_escalation]
distribution = uniform
min = 1.0
max = 1.25
scale = auto

