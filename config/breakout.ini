[base]
env_name = breakout
async = 1

[vec]
total_agents = 4096
num_buffers = 1
num_threads = 8
gpu_env = 1
num_policies = 1

[policy]
num_layers = 4
hidden_size = 32

[env]
num_agents = 1
frameskip = 3
width = 576
height = 330
initial_paddle_width = 62
paddle_width = 62
paddle_height = 8
ball_width = 32
ball_height = 32
brick_width = 32
brick_height = 12
brick_rows = 6
brick_cols = 18
initial_ball_speed = 256
max_ball_speed = 448
paddle_speed = 620
continuous = 0


